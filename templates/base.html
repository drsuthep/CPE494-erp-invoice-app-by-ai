<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ERP Invoice{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* Zen Green Theme */
        :root {
            --zen-primary: #004d40;
            --zen-primary-soft: #2e7d64;
            --zen-accent: #a5d6a7;
            --zen-surface: #e8f5e9;
            --zen-border: #81c784;
            --zen-error: #c62828;
        }

        /* Viewport scrolling rules */
        .list-viewport {
            max-height: 60vh;
            overflow-y: auto;
        }
        .list-viewport thead {
            position: sticky;
            top: 0;
            background: var(--zen-primary-soft);
            color: white;
            z-index: 1;
        }
        .lineitem-viewport {
            max-height: 50vh;
            overflow-y: auto;
        }
        .lineitem-viewport thead {
            position: sticky;
            top: 0;
            background: var(--zen-primary-soft);
            color: white;
            z-index: 1;
        }

        /* Flash message styling */
        #flash-stack {
            position: fixed;
            top: 5rem;
            right: 1rem;
            z-index: 1050;
            min-width: 250px;
        }
        .flash-msg {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--zen-primary);">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'core:landing' %}">ERP Invoice</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <!-- Future nav links will be added here -->
                </ul>
            </div>
        </div>
    </nav>

    {% if messages %}
    <div id="flash-stack" aria-live="polite">
        {% for m in messages %}
        <div class="alert alert-{{ m.tags|default:'success' }} flash-msg" role="alert">{{ m }}</div>
        {% endfor %}
    </div>
    <script>
        setTimeout(function () {
            document.querySelectorAll('.flash-msg').forEach(function (el) {
                el.style.transition = 'opacity 0.5s';
                el.style.opacity = '0';
                setTimeout(function () { el.remove(); }, 500);
            });
            if (window.clearDirty) window.clearDirty();
        }, 2000);
    </script>
    {% endif %}

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dirty Bit Listener -->
    <script>
      (function () {
        let formDirty = false;
        document.addEventListener('input', function (e) {
          if (e.target.matches('form input, form select, form textarea')) formDirty = true;
        }, true);
        window.formDirty = () => formDirty;
        window.clearDirty = () => { formDirty = false; };
        window.addEventListener('beforeunload', function (e) {
          if (formDirty) { e.preventDefault(); e.returnValue = ''; }
        });
      })();
    </script>
</body>
</html>
